services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - vector_data:/qdrant/storage
  ollama:
    image: ollama/ollama:0.40.14
    profiles: ["stack"]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - model_data:/root/.ollama
  api:
    build: .
    profiles: ["stack"]
    depends_on: [qdrant, ollama]
    environment:
      AQS_QDRANT_URL: http://qdrant:6333
      AQS_OLLAMA_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  vector_data:
  model_data:
