name: Full local-model release gate
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create a candidate for review before the first baseline is approved
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: local-evaluation
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, aqs-local]
    environment: aqs-local-evaluation
    timeout-minutes: 300
    env:
      AQS_PROVIDER: ollama
      AQS_ALLOW_REMOTE: "false"
      AQS_MODEL: qwen2.5:3b
      AQS_JUDGE_MODEL: qwen2.5:3b
      AQS_RUN_LIVE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      RAGAS_DO_NOT_TRACK: "true"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.4"
      - run: uv sync --locked --group judges
      - run: uv run --no-sync python -m evaluation.datasets
      - run: uv run --no-sync python -m pytest -m live --junitxml=junit.xml
      - name: Evaluate full dataset and enforce gates
        env:
          BOOTSTRAP_BASELINE: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          options=(--max-cases 66 --max-safety-cases 35 --repetitions 3 --db state/ci-evaluations.sqlite)
          if [[ "$BOOTSTRAP_BASELINE" != "true" ]]; then
            options+=(--require-baseline)
            if [[ -f baselines/approved.json ]]; then
              options+=(--baseline-file baselines/approved.json)
            fi
          fi
          uv run --no-sync python -m evaluation.runner "${options[@]}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-local-evaluation
          path: |
            reports/
            junit.xml
            state/ci-evaluations.sqlite
          retention-days: 14
