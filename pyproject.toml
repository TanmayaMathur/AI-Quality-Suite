[project]
name = "ai-quality-suite"
version = "0.1.0"
description = "RAG quality, safety, and regression evaluation for a synthetic smart-home corpus"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "llama-index-core==0.12.52",
    "pydantic-settings==2.10.1",
    "qdrant-client==1.15.1",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = ["pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.7"]
judges = [
    "deepeval==3.3.9",
    "ragas==0.2.15",
    "langchain==0.3.27",
    "langchain-community==0.3.29",
    "langchain-core==0.3.79",
    "langchain-ollama==0.3.10",
    "langchain-openai==0.3.33",
    "datasets==3.6.0",
    "pyarrow==20.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires local Ollama models and Qdrant"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["app", "evaluation", "database"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
